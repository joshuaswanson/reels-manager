[project]
name = "reels-manager"
version = "0.1.0"
description = "Browse, organize, and download your saved Instagram reels"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pywebview>=6.2.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
